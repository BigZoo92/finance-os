# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# Moon Stage B: explicit tasks with inputs/outputs; caching and affected selection are
# owned by Moon. `pnpm run` keeps package.json as the single source of the commands.
id: 'worker'
language: 'typescript'
layer: 'application'
tags: ['backend']
project:
  title: 'Worker'
  description: 'Bun worker: schedules, ingestion, derived recompute.'
tasks:
  typecheck:
    command: 'pnpm run typecheck'
    deps: ['^:typecheck']
    inputs: ['@group(sources)', '@group(tests)', '@group(configs)']
  test:
    command: 'pnpm run test'
    deps: ['^:typecheck']
    inputs: ['@group(sources)', '@group(tests)', '@group(configs)']
  dev:
    command: 'pnpm run dev'
    options:
      cache: false
      persistent: true
      runInCI: false
  start:
    command: 'pnpm run start'
    options:
      cache: false
      persistent: true
      runInCI: false
