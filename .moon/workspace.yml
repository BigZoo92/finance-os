# yaml-language-server: $schema=https://moonrepo.dev/schemas/workspace.json
# Moon Stage B: Moon owns task caching, affected selection (`moon run --affected`,
# `moon ci`) and architecture constraints. Tasks are explicit per project.
projects:
  globs:
    - 'apps/*'
    - 'packages/*'
  sources:
    root: '.'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'

constraints:
  # application -> library/configuration, library -> library/configuration.
  enforceLayerRelationships: true
  # The browser app graph never reaches a backend-only package; backend projects
  # reach backend and shared packages; shared packages stay shared.
  tagRelationships:
    frontend: ['frontend', 'shared']
    backend: ['backend', 'shared']
    shared: ['shared']

hasher:
  optimization: 'accuracy'
  warnOnMissingInputs: false

pipeline:
  cacheLifetime: '7 days'
